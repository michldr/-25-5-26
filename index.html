<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יום מהו"ת 2/12/26</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --line: #e3e7ee;
      --brand: #2f5d9e;
      --brand-dark: #23477a;
      --free: #1e8a4c;
      --free-bg: #eaf7ef;
      --taken: #2f5d9e;
      --taken-bg: #e8f0fb;
      --danger: #c0392b;
      --danger-bg: #fdecea;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

    header {
      background: var(--brand);
      color: #fff;
      text-align: center;
      padding: 28px 16px 24px;
    }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; opacity: .9; }

    .summary {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 18px; margin: -14px 0 16px; position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }
    .summary .count { font-weight: 700; font-size: 18px; }
    .summary .hint { color: var(--muted); font-size: 14px; }
    .legend { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-left: 5px; }

    .hour { margin-bottom: 18px; }
    .hour h3 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(6, 1fr); } }

    .slot {
      border: 1.5px solid transparent; border-radius: 12px;
      padding: 12px 6px; font: inherit; text-align: center; cursor: pointer;
      min-width: 0; transition: transform .08s, box-shadow .15s;
    }
    .slot:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.1); }
    .slot .t { display: block; font-size: 18px; font-weight: 700; direction: ltr; }
    .slot .s { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot.free { background: var(--free-bg); color: var(--free); border-color: #bfe5cd; }
    .slot.taken { background: var(--taken-bg); color: var(--taken); border-color: #c9d9f1; }
    .slot.taken .s { color: var(--text); font-weight: 600; }

    .state { text-align: center; color: var(--muted); padding: 30px 10px; background: var(--card); border-radius: var(--radius); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 10px; padding: 12px 18px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-light { background: #eef1f5; color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger-light { background: var(--danger-bg); color: var(--danger); }
    .btn-sm { padding: 7px 12px; font-size: 14px; }
    .link-btn { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px; }

    footer { text-align: center; margin-top: 28px; font-size: 14px; }

    /* חלון קופץ */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.5);
      display: none; align-items: flex-end; justify-content: center; z-index: 10;
    }
    .overlay.open { display: flex; }
    @media (min-width: 560px) { .overlay { align-items: center; } }
    .modal {
      background: var(--card); width: 100%; max-width: 440px;
      border-radius: 18px 18px 0 0; padding: 22px 20px 24px;
      max-height: 92vh; overflow-y: auto;
    }
    @media (min-width: 560px) { .modal { border-radius: 18px; } }
    .modal.wide { max-width: 620px; }
    .modal h2 { margin: 0 0 4px; font-size: 21px; }
    .modal .sub { margin: 0 0 16px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 12px; font: inherit; font-size: 16px;
      border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
    }
    input:focus { outline: none; border-color: var(--brand); }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .actions .btn { flex: 1; }
    .error { background: var(--danger-bg); color: var(--danger); padding: 10px 12px; border-radius: 10px; margin-top: 14px; display: none; }
    .error.show { display: block; }

    .admin-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .admin-table th, .admin-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .admin-table th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .admin-table td.time { direction: ltr; text-align: right; font-weight: 700; white-space: nowrap; }
    .admin-table tr.empty td { color: #9aa3af; }
    .admin-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: #1f2a37; color: #fff; padding: 12px 18px; border-radius: 10px;
      transition: transform .25s, opacity .25s, visibility .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center;
      opacity: 0; visibility: hidden;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
  </style>
</head>
<body>
  <header>
    <h1>יום מהו"ת 2/12/26</h1>
    <p>פגישות אישיות של 10 דקות · <bdi dir="ltr">16:00–20:00</bdi></p>
  </header>

  <main class="wrap">
    <div class="summary">
      <div class="count" id="count">טוען...</div>
      <div class="hint">לחצו על שעה פנויה כדי להירשם, או על הרשמה קיימת כדי לבטל אותה</div>
      <div class="legend">
        <span><i style="background:var(--free-bg);border:1px solid #bfe5cd"></i>פנוי</span>
        <span><i style="background:var(--taken-bg);border:1px solid #c9d9f1"></i>רשום</span>
      </div>
    </div>

    <div id="slots"><div class="state">טוען שעות...</div></div>

    <footer>
      <button class="link-btn" onclick="openAdminLogin()">כניסת מנהל</button>
    </footer>
  </main>

  <!-- הרשמה -->
  <div class="overlay" id="bookModal" onclick="closeOnBackdrop(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
      <h2 id="bookTitle">הרשמה לשעה <span id="bookTime" dir="ltr"></span></h2>
      <p class="sub">הפגישה נמשכת 10 דקות</p>
      <form onsubmit="submitBooking(event)">
        <label for="parentName">שם ההורה</label>
        <input id="parentName" autocomplete="name" maxlength="60" required>
        <label for="childName">שם הילד/ה</label>
        <input id="childName" maxlength="60" required>
        <div class="error" id="bookError"></div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="bookSubmit">הרשמה</button>
          <button type="button" class="btn btn-light" onclick="closeModals()">חזרה</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ביטול -->
  <div class="overlay" id="cancelModal" onclick="closeOnBackdrop(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
      <h2 id="cancelTitle">ביטול הרשמה</h2>
      <p class="sub" id="cancelText"></p>
      <div class="error" id="cancelError"></div>
      <div class="actions">
        <button type="button" class="btn btn-danger" id="cancelSubmit" onclick="submitCancel()">ביטול ההרשמה</button>
        <button type="button" class="btn btn-light" onclick="closeModals()">חזרה</button>
      </div>
    </div>
  </div>

  <!-- כניסת מנהל -->
  <div class="overlay" id="adminLoginModal" onclick="closeOnBackdrop(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adminLoginTitle">
      <h2 id="adminLoginTitle">כניסת מנהל</h2>
      <form onsubmit="submitAdminLogin(event)">
        <label for="adminPassword">סיסמה</label>
        <input id="adminPassword" type="password" autocomplete="current-password" required>
        <div class="error" id="adminLoginError"></div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="adminLoginSubmit">כניסה</button>
          <button type="button" class="btn btn-light" onclick="closeModals()">חזרה</button>
        </div>
      </form>
    </div>
  </div>

  <!-- לוח מנהל -->
  <div class="overlay" id="adminModal" onclick="closeOnBackdrop(event)">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <h2 id="adminTitle">ניהול הרשמות</h2>
      <p class="sub" id="adminSummary"></p>
      <div class="admin-tools">
        <button class="btn btn-light btn-sm" onclick="copyAdminList()">העתקת הרשימה</button>
        <button class="btn btn-danger-light btn-sm" id="clearAllBtn" onclick="clearAll()">מחיקת כל ההרשמות</button>
      </div>
      <div class="error" id="adminError"></div>
      <table class="admin-table">
        <thead><tr><th>שעה</th><th>ילד/ה</th><th>הורה</th><th></th></tr></thead>
        <tbody id="adminRows"></tbody>
      </table>
      <div class="actions">
        <button type="button" class="btn btn-light" onclick="closeModals()">סגירה</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwhLI_bqw5LonilgbHq4RRL-a06lQaZcsPKNWWOQMagxD0FTb2QXb6H0O1kFFrbIVBK/exec";

    // 24 מפגשים של 10 דקות, החל מ-16:00 (המפגש האחרון ב-19:50, מסתיים ב-20:00)
    // חייב להיות זהה לרשימה ב-apps-script/Code.gs
    const slots = ["16:00","16:10","16:20","16:30","16:40","16:50",
                   "17:00","17:10","17:20","17:30","17:40","17:50",
                   "18:00","18:10","18:20","18:30","18:40","18:50",
                   "19:00","19:10","19:20","19:30","19:40","19:50"];

    let taken = new Map(); // שעה -> שם הילד/ה
    let loaded = false;
    let selectedTime = null;
    let adminPassword = null;
    let adminBookings = [];

    // ---------- תקשורת עם השרת ----------

    async function api(body) {
      // בלי כותרות מיוחדות, כדי שהדפדפן ישלח בקשה "פשוטה" ש-Apps Script מקבל ואפשר לקרוא את התשובה שלה
      const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(body) });
      return res.json();
    }

    async function loadBookings() {
      try {
        const res = await fetch(WEB_APP_URL + "?t=" + Date.now());
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "bad response");
        taken = new Map(data.taken.map(b => [b.time, b.child]));
        loaded = true;
        render();
      } catch (e) {
        console.error("שגיאה בטעינת הנתונים:", e);
        if (!loaded) {
          document.getElementById("slots").innerHTML =
            '<div class="state">לא הצלחנו לטעון את השעות.<br><br>' +
            '<button class="btn btn-primary" onclick="loadBookings()">נסו שוב</button></div>';
          document.getElementById("count").textContent = "";
        }
      }
    }

    // ---------- תצוגה ----------

    function render() {
      const free = slots.filter(t => !taken.has(t)).length;
      document.getElementById("count").textContent =
        free === 0 ? "כל השעות תפוסות" :
        free === 1 ? "נותרה שעה פנויה אחת" :
        `נותרו ${free} שעות פנויות מתוך ${slots.length}`;

      // השעות, מקובצות לפי שעה עגולה
      const container = document.getElementById("slots");
      container.innerHTML = "";
      const byHour = {};
      slots.forEach(t => (byHour[t.slice(0, 2)] ||= []).push(t));
      Object.keys(byHour).forEach(h => {
        const section = el("section", "hour");
        const range = el("bdi", "", `${h}:00–${+h + 1}:00`);
        range.dir = "ltr";
        section.appendChild(el("h3")).appendChild(range);
        const grid = el("div", "grid");
        byHour[h].forEach(t => {
          const child = taken.get(t);
          const btn = el("button", "slot " + (child !== undefined ? "taken" : "free"));
          btn.type = "button";
          btn.appendChild(el("span", "t", t));
          if (child !== undefined) {
            const name = el("span", "s", child);
            name.title = child;
            btn.appendChild(name);
            btn.setAttribute("aria-label", `${t} ${child}, לחצו לביטול`);
            btn.onclick = () => openCancel(t);
          } else {
            btn.appendChild(el("span", "s", "פנוי"));
            btn.setAttribute("aria-label", `${t} פנוי, לחצו להרשמה`);
            btn.onclick = () => openBooking(t);
          }
          grid.appendChild(btn);
        });
        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // ---------- הרשמה ----------

    function openBooking(time) {
      selectedTime = time;
      document.getElementById("bookTime").textContent = time;
      hideError("bookError");
      setBusy("bookSubmit", false, "הרשמה");
      document.getElementById("childName").value = "";
      openModal("bookModal");
      // שם ההורה נשאר מהרשמה קודמת (נוח להורים לכמה ילדים)
      const parentInput = document.getElementById("parentName");
      (parentInput.value ? document.getElementById("childName") : parentInput).focus();
    }

    async function submitBooking(ev) {
      ev.preventDefault();
      const parent = document.getElementById("parentName").value.trim();
      const child = document.getElementById("childName").value.trim();
      if (!parent || !child) return showError("bookError", "יש למלא את שני השדות");

      hideError("bookError");
      setBusy("bookSubmit", true, "שומר...");
      try {
        const res = await api({ action: "book", time: selectedTime, parent, child });
        if (!res.ok) {
          showError("bookError", res.error || "ההרשמה נכשלה");
          setBusy("bookSubmit", false, "הרשמה");
          if (res.code === "TAKEN") loadBookings();
          return;
        }
        taken.set(res.time, child);
        render();
        closeModals();
        toast(`נרשמתם! ${child} לשעה ${res.time}`);
      } catch (e) {
        console.error(e);
        showError("bookError", "אין חיבור לשרת. בדקו את החיבור לאינטרנט ונסו שוב.");
        setBusy("bookSubmit", false, "הרשמה");
      }
    }

    // ---------- ביטול ----------

    function openCancel(time) {
      selectedTime = time;
      document.getElementById("cancelText").textContent =
        `לבטל את ההרשמה של ${taken.get(time)} לשעה ${time}?`;
      hideError("cancelError");
      setBusy("cancelSubmit", false, "ביטול ההרשמה");
      openModal("cancelModal");
    }

    async function submitCancel() {
      const time = selectedTime;
      setBusy("cancelSubmit", true, "מבטל...");
      try {
        const res = await api({ action: "cancel", time });
        if (!res.ok) {
          showError("cancelError", res.error || "הביטול נכשל");
          setBusy("cancelSubmit", false, "ביטול ההרשמה");
          loadBookings();
          return;
        }
        taken.delete(time);
        render();
        closeModals();
        toast(`ההרשמה לשעה ${time} בוטלה`);
      } catch (e) {
        console.error(e);
        showError("cancelError", "אין חיבור לשרת, נסו שוב");
        setBusy("cancelSubmit", false, "ביטול ההרשמה");
      }
    }

    // ---------- מנהל ----------

    function openAdminLogin() {
      if (adminPassword) return refreshAdmin();
      document.getElementById("adminPassword").value = "";
      hideError("adminLoginError");
      setBusy("adminLoginSubmit", false, "כניסה");
      openModal("adminLoginModal");
      document.getElementById("adminPassword").focus();
    }

    async function submitAdminLogin(ev) {
      ev.preventDefault();
      const password = document.getElementById("adminPassword").value;
      setBusy("adminLoginSubmit", true, "בודק...");
      try {
        const res = await api({ action: "adminList", password });
        if (!res.ok) {
          showError("adminLoginError", res.error || "הכניסה נכשלה");
          setBusy("adminLoginSubmit", false, "כניסה");
          return;
        }
        adminPassword = password; // נשמר רק בזיכרון של הדף, עד שסוגרים או מרעננים
        showAdmin(res.bookings);
      } catch (e) {
        console.error(e);
        showError("adminLoginError", "אין חיבור לשרת, נסו שוב");
        setBusy("adminLoginSubmit", false, "כניסה");
      }
    }

    async function refreshAdmin() {
      try {
        const res = await api({ action: "adminList", password: adminPassword });
        if (!res.ok) { adminPassword = null; return openAdminLogin(); }
        showAdmin(res.bookings);
      } catch (e) {
        toast("אין חיבור לשרת, נסו שוב");
      }
    }

    function showAdmin(bookings) {
      adminBookings = bookings;
      const byTime = {};
      bookings.forEach(b => byTime[b.time] = b);
      document.getElementById("adminSummary").textContent =
        `${bookings.length} רשומים מתוך ${slots.length} שעות`;
      hideError("adminError");
      resetClearAllBtn();

      const tbody = document.getElementById("adminRows");
      tbody.innerHTML = "";
      slots.forEach(t => {
        const b = byTime[t];
        const tr = el("tr", b ? "" : "empty");
        tr.appendChild(el("td", "time", t));
        tr.appendChild(el("td", "", b ? b.child : "פנוי"));
        tr.appendChild(el("td", "", b ? b.parent : ""));
        const td = el("td");
        if (b) {
          const btn = el("button", "btn btn-danger-light btn-sm", "ביטול");
          btn.onclick = () => adminCancel(t, btn);
          td.appendChild(btn);
        }
        tr.appendChild(td);
        tbody.appendChild(tr);
      });

      // מעדכן גם את הדף הראשי
      taken = new Map(bookings.map(b => [b.time, b.child]));
      render();
      openModal("adminModal");
    }

    async function adminCancel(time, btn) {
      if (btn.dataset.armed !== "1") {
        btn.dataset.armed = "1";
        btn.textContent = "בטוח?";
        btn.className = "btn btn-danger btn-sm";
        return;
      }
      btn.disabled = true;
      btn.textContent = "...";
      await adminAction({ action: "adminCancel", time }, `ההרשמה לשעה ${time} בוטלה`);
    }

    async function clearAll() {
      const btn = document.getElementById("clearAllBtn");
      if (btn.dataset.armed !== "1") {
        btn.dataset.armed = "1";
        btn.textContent = "לחצו שוב כדי למחוק את כל ההרשמות";
        btn.className = "btn btn-danger btn-sm";
        return;
      }
      btn.disabled = true;
      btn.textContent = "מוחק...";
      await adminAction({ action: "clearAll" }, "כל ההרשמות נמחקו");
    }

    function resetClearAllBtn() {
      const btn = document.getElementById("clearAllBtn");
      btn.dataset.armed = "";
      btn.disabled = false;
      btn.textContent = "מחיקת כל ההרשמות";
      btn.className = "btn btn-danger-light btn-sm";
    }

    async function adminAction(body, okMessage) {
      try {
        const res = await api({ ...body, password: adminPassword });
        if (!res.ok) {
          showError("adminError", res.error || "הפעולה נכשלה");
          if (res.code === "BAD_PASSWORD") adminPassword = null;
          resetClearAllBtn();
          return;
        }
        toast(okMessage);
        showAdmin(res.bookings);
      } catch (e) {
        console.error(e);
        showError("adminError", "אין חיבור לשרת, נסו שוב");
        resetClearAllBtn();
      }
    }

    async function copyAdminList() {
      const text = slots
        .map(t => {
          const b = adminBookings.find(x => x.time === t);
          return b ? `${t}  ${b.child} (${b.parent})` : `${t}  —`;
        })
        .join("\n");
      try {
        await navigator.clipboard.writeText(`יום מהו"ת 2/12/26\n\n${text}`);
        toast("הרשימה הועתקה");
      } catch (e) {
        toast("ההעתקה לא נתמכת בדפדפן הזה");
      }
    }

    // ---------- חלונות והודעות ----------

    function openModal(id) {
      document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open"));
      document.getElementById(id).classList.add("open");
    }
    function closeModals() {
      document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open"));
    }
    function closeOnBackdrop(ev) {
      if (ev.target.classList.contains("overlay")) closeModals();
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });

    function showError(id, msg) {
      const e = document.getElementById(id);
      e.textContent = msg;
      e.classList.add("show");
    }
    function hideError(id) {
      document.getElementById(id).classList.remove("show");
    }
    function setBusy(id, busy, label) {
      const b = document.getElementById(id);
      b.disabled = busy;
      b.textContent = label;
    }

    let toastTimer;
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
    }

    // ---------- הפעלה ----------

    loadBookings();
    // רענון כל 15 שניות, רק כשהדף גלוי, וכשאין חלון פתוח (כדי לא להפריע בזמן מילוי)
    setInterval(() => {
      if (document.visibilityState === "visible" && !document.querySelector(".overlay.open")) loadBookings();
    }, 15000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadBookings();
    });
  </script>
</body>
</html>
